<html lang="ja">
<head>
<meta charset="utf-8">

<title>未明新聞 号外</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#EBE3CF;
  --paper-2:#E1D8C1;
  --paper-3:#D5CBB1;
  --ink:#231C2C;
  --ink-2:#4A4152;
  --muted:#7D7466;
  --rule:#B8AD93;
  --accent:#5B3A7A;
  --accent-ink:#F3ECFF;
  --seal:#A8302B;
  --bubble:#F6F1E4;
  --shadow:0 18px 40px -22px rgba(35,28,44,.55);
  --grain:rgba(35,28,44,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#191423;
    --paper-2:#211A2E;
    --paper-3:#2B2339;
    --ink:#E6DECB;
    --ink-2:#C4BAA6;
    --muted:#8E8577;
    --rule:#4A3F5C;
    --accent:#B394DB;
    --accent-ink:#1A1224;
    --seal:#D0524B;
    --bubble:#241D31;
    --shadow:0 18px 40px -20px rgba(0,0,0,.9);
    --grain:rgba(230,222,203,.04);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#191423;
  --paper-2:#211A2E;
  --paper-3:#2B2339;
  --ink:#E6DECB;
  --ink-2:#C4BAA6;
  --muted:#8E8577;
  --rule:#4A3F5C;
  --accent:#B394DB;
  --accent-ink:#1A1224;
  --seal:#D0524B;
  --bubble:#241D31;
  --shadow:0 18px 40px -20px rgba(0,0,0,.9);
  --grain:rgba(230,222,203,.04);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  background-image:
    repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 3px),
    radial-gradient(120% 80% at 50% 0%, var(--paper-2), var(--paper) 60%);
  color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px; line-height:1.7;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 20px 56px}

/* ── masthead ─────────────────────────── */
.masthead{
  border-top:3px double var(--ink);
  border-bottom:1px solid var(--ink);
  padding:12px 0 10px;
  display:grid; grid-template-columns:1fr auto 1fr; align-items:end; gap:12px;
}
.masthead .left,.masthead .right{font-size:12px;color:var(--ink-2);letter-spacing:.06em;line-height:1.5}
.masthead .right{text-align:right}
.masthead h1{
  margin:0; text-align:center;
  font-family:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  font-weight:800; font-size:clamp(34px,6vw,54px); letter-spacing:.18em; line-height:1;
  text-indent:.18em;
}
.masthead .gogai{
  display:inline-block; margin-top:8px;
  font-family:"Shippori Mincho B1",serif; font-weight:700; font-size:13px; letter-spacing:.35em; text-indent:.35em;
  color:var(--seal); border:1.5px solid var(--seal); padding:2px 10px 1px; border-radius:2px;
  transform:rotate(-2deg);
}
.tagline{
  text-align:center; font-size:12.5px; color:var(--muted); letter-spacing:.12em; padding:8px 0 0;
  border-bottom:1px solid var(--rule);
}

/* ── controls ─────────────────────────── */
.controls{
  display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; justify-content:space-between;
  padding:14px 0 6px; border-bottom:1px solid var(--rule);
}
.group{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.group .lbl{font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-right:2px}
.chip{
  appearance:none; border:1px solid var(--rule); background:transparent; color:var(--ink-2);
  font:inherit; font-size:12.5px; padding:4px 11px; border-radius:999px; cursor:pointer; letter-spacing:.04em;
  transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ── stage ────────────────────────────── */
.stage{
  display:grid; grid-template-columns:minmax(240px,340px) 1fr; gap:28px; align-items:start;
  padding:26px 0 0;
}
@media (max-width:760px){ .stage{grid-template-columns:1fr; gap:18px} }

.char{position:relative; text-align:center}
.bubble{
  position:relative; background:var(--bubble); border:1px solid var(--rule);
  border-radius:14px; padding:12px 16px; margin:0 0 14px;
  font-family:"Shippori Mincho B1",serif; font-size:15.5px; line-height:1.75; color:var(--ink);
  text-align:left; box-shadow:var(--shadow); min-height:66px;
}
.bubble:after{
  content:""; position:absolute; left:50%; bottom:-9px; width:16px; height:16px;
  background:var(--bubble); border-right:1px solid var(--rule); border-bottom:1px solid var(--rule);
  transform:translateX(-50%) rotate(45deg);
}
.portrait{
  width:min(100%,300px); height:400px; margin:0 auto; display:block; object-fit:contain; object-position:center bottom;
  filter:drop-shadow(0 22px 22px rgba(20,10,30,.28));
}
.portrait-ph{
  width:min(100%,300px); aspect-ratio:3/4; margin:0 auto; display:grid; place-items:center;
  border:1px dashed var(--rule); border-radius:6px; color:var(--muted); font-size:12px; letter-spacing:.1em;
  background:repeating-linear-gradient(0deg, transparent 0 8px, var(--grain) 8px 9px);
}
.char .name{
  margin:10px 0 0; font-family:"Shippori Mincho B1",serif; font-weight:700; font-size:15px; letter-spacing:.2em; text-indent:.2em;
}
.char .role{font-size:11.5px; color:var(--muted); letter-spacing:.08em; margin-top:2px}

/* ── article ──────────────────────────── */
.article{
  position:relative; display:grid; grid-template-columns:auto 1fr; gap:0 22px;
  border:1px solid var(--ink); padding:20px 22px 20px 18px;
  background:var(--paper-2); box-shadow:var(--shadow);
}
.article:before{
  content:""; position:absolute; inset:5px; border:1px solid var(--rule); pointer-events:none;
}
.vert{
  display:flex; flex-direction:column; gap:.32em; align-self:start;
  font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:20px; line-height:1;
  color:var(--accent); border-right:1px solid var(--rule); padding:6px 12px 6px 0;
}
.article .body{min-width:0}
.dateline{
  display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center;
  font-size:11.5px; letter-spacing:.12em; color:var(--muted); margin:0 0 8px;
}
.cat{
  color:var(--seal); border:1px solid var(--seal); padding:0 7px; border-radius:2px; font-weight:700; letter-spacing:.14em;
}
.headline{
  margin:0; font-family:"Shippori Mincho B1",serif; font-weight:800;
  font-size:clamp(20px,2.6vw,27px); line-height:1.45; letter-spacing:.02em; text-wrap:balance;
  overflow-wrap:anywhere;
}
.sub{margin:8px 0 0; color:var(--ink-2); font-size:13.5px; line-height:1.7; overflow-wrap:anywhere}
.facts{
  display:grid; grid-template-columns:repeat(3,auto); justify-content:start; gap:6px 24px;
  margin:16px 0 0; padding:12px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
  font-variant-numeric:tabular-nums;
}
.facts div{display:grid; gap:1px}
.facts dt{font-size:10.5px; letter-spacing:.2em; color:var(--muted)}
.facts dd{margin:0; font-family:"Shippori Mincho B1",serif; font-weight:700; font-size:16px}
.actions{display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; margin-top:16px}
.btn{
  appearance:none; border:none; cursor:pointer; font:inherit; font-weight:700; text-decoration:none; display:inline-block;
  background:var(--accent); color:var(--accent-ink); padding:11px 20px; border-radius:4px; letter-spacing:.1em;
  box-shadow:0 6px 0 -2px color-mix(in srgb, var(--accent) 60%, black);
  transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(2px); box-shadow:0 2px 0 -2px color-mix(in srgb, var(--accent) 60%, black)}
.btn.big{font-size:16px; padding:14px 30px; font-family:"Shippori Mincho B1",serif; font-weight:800; letter-spacing:.24em; text-indent:.24em}
.link{color:var(--ink); font-weight:500; text-decoration:underline; text-underline-offset:4px; text-decoration-color:var(--rule)}
.link:hover{text-decoration-color:var(--ink)}
.seal{
  position:absolute; right:14px; top:12px; transform:rotate(8deg);
  font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:12px; letter-spacing:.2em; text-indent:.2em;
  color:var(--seal); border:2px solid var(--seal); border-radius:50%; width:58px; height:58px;
  display:grid; place-items:center; line-height:1.1; text-align:center; opacity:.85;
  mix-blend-mode:multiply;
}
:root[data-theme="dark"] .seal{mix-blend-mode:screen}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seal{mix-blend-mode:screen} }
@media (max-width:520px){ .vert{display:none} .article{grid-template-columns:1fr} .facts{grid-template-columns:1fr 1fr} }

/* ── deliver bar ──────────────────────── */
.deliver{
  display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center; justify-content:center;
  padding:26px 0 14px;
}
.count{font-size:12px; color:var(--muted); letter-spacing:.1em; font-variant-numeric:tabular-nums}
.count b{color:var(--ink); font-weight:700}
.reset{appearance:none; background:none; border:none; color:var(--muted); font:inherit; font-size:12px; cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.reset:hover{color:var(--ink)}

footer{margin-top:22px; padding-top:12px; border-top:1px solid var(--rule); font-size:11.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:space-between}
footer a{color:var(--ink-2)}

/* ── motion ───────────────────────────── */
.article.drop{animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-14px) rotate(-.6deg); opacity:0}to{transform:none; opacity:1}}
.char.shake .portrait,.char.shake .portrait-ph{animation:shake .5s ease}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px) rotate(-1.5deg)}50%{transform:translateX(4px) rotate(1.5deg)}75%{transform:translateX(-2px)}}
.bubble.pop{animation:pop .3s ease}
@keyframes pop{from{transform:scale(.96); opacity:.4}to{transform:none; opacity:1}}
@media (prefers-reduced-motion: reduce){ .article.drop,.char.shake .portrait,.char.shake .portrait-ph,.bubble.pop{animation:none} }
</style>

</head>

<div class="wrap">

const saveSeen=()=>{ try{ localStorage.setItem('mimei.seen', JSON.stringify([...seen])); }catch(e){} };
const $=id=>document.getElementById(id);
const pick=a=>a[Math.floor(Math.random()*a.length)];

// ── masthead date ──
(function(){
  const d=new Date(); const y=d.getFullYear(); const r=y-2018;
  const w=['日','月','火','水','木','金','土'][d.getDay()];
  $('wareki').textContent=`令和${r}年${d.getMonth()+1}月${d.getDate()}日（${w}）`;
  $('edition').textContent=(d.getHours()<5||d.getHours()>=22)?'未明版':'夕刊';
  $('total').textContent=VIDEOS.length;
})();

// ── character ──
function showChar(key, text){
  const c=CHARS[key];
  const p=$('portrait');
  p.innerHTML = IMGS[key]
    ? `<img class="portrait" src="${IMGS[key]}" alt="${c.name}">`
    : `<div class="portrait-ph" role="img" aria-label="${c.name}の画像">${c.name}（画像未設定）</div>`;
  $('cname').textContent=`${c.name}〈${c.kana}〉`;
  $('crole').textContent=c.role;
  const b=$('bubble'); b.textContent=text; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

function showPair(){
  const p=$('portrait');
  p.innerHTML = IMGS.pair ? `<img class="portrait" src="${IMGS.pair}" alt="ホゴとヨミ">` : '';
  $('cname').textContent='ホゴ と ヨミ'; $('crole').textContent='誰が届けるかは、押してからのお楽しみ';
  const b=$('bubble'); b.textContent=pick(['…ぼくが…','わ、わたしが…行きます…','…どっちが…届ける…？']); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

// ── article ──
function splitTitle(t){
  // 「｜」以降は出演者などの補足として小さく出す
  const i=t.indexOf('｜'); if(i<0) return [t,''];
  return [t.slice(0,i).trim(), t.slice(i+1).trim()];
}
function showVideo(v){
  const [h,s]=splitTitle(v.t);
  $('atitle').textContent=h; $('asub').textContent=s? '出演・補足：'+s : '';
  $('acat').textContent=CATS[v.c].label; $('acat2').textContent=CATS[v.c].label;
  $('aage').textContent=v.a+'公開'; $('aid').textContent='No.'+v.id;
  $('adur').textContent=v.d; $('aviews').textContent=v.v.replace('回視聴','回');
  $('watch').href='https://www.youtube.com/watch?v='+v.id;
  const a=$('article'); a.classList.remove('drop'); void a.offsetWidth; a.classList.add('drop');
}

function deliver(){
  let pool=VIDEOS.filter(v=>cat==='all'||v.c===cat);
  let fresh=pool.filter(v=>!seen.has(v.id));
  if(!fresh.length){ pool.forEach(v=>seen.delete(v.id)); fresh=pool; }
  const v=pick(fresh); seen.add(v.id); saveSeen();
  const key=charPick==='any'?pick(Object.keys(CHARS)):charPick;
  const c=CHARS[key];
  const line=(Math.random()<0.45 && c.cat[v.c])?c.cat[v.c]:pick(c.lines);
  const ch=$('char'); ch.classList.remove('shake'); void ch.offsetWidth; ch.classList.add('shake');
  showChar(key,line); showVideo(v);
  $('seen').textContent=seen.size;
}

// ── controls ──
document.querySelectorAll('.chip[data-cat]').forEach(b=>b.addEventListener('click',()=>{
  cat=b.dataset.cat;
  document.querySelectorAll('.chip[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
document.querySelectorAll('.chip[data-char]').forEach(b=>b.addEventListener('click',()=>{
  charPick=b.dataset.char;
  document.querySelectorAll('.chip[data-char]').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(charPick!=='any'){ showChar(charPick, pick(CHARS[charPick].idle)); }
  else { showPair(); }
}));
$('go').addEventListener('click',deliver);
$('reset').addEventListener('click',()=>{ seen.clear(); saveSeen(); $('seen').textContent=0; });
document.addEventListener('keydown',e=>{ if(e.key===' '&&e.target===document.body){ e.preventDefault(); deliver(); } });

// ── first frame: deliver once so the page opens in a working state ──
$('seen').textContent=seen.size;
deliver();
</script>

</body>
</html>
